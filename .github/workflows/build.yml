name: build

# 多端打包：macOS / Windows / Linux / Android / iOS。
#
# 触发方式：
#   - 手动：Actions → build → Run workflow
#   - 打 tag：git tag v0.1.0 && git push origin v0.1.0（会自动创建草稿 Release 并附上产物）
#
# 产物默认**不签名**（debug APK / 模拟器 .app / ad-hoc 签名的 macOS 包），
# 因为签名证书必须放在仓库 Secrets 里。如何接入签名见 docs/05-ci.md。

on:
  workflow_dispatch:
    inputs:
      targets:
        description: '要构建哪些平台'
        type: choice
        default: all
        options:
          - all
          - desktop
          - mobile
          - android
          - ios
  push:
    tags:
      - 'v*'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # 移动端打包在 Tauri CLI 里会读 CI 变量跳过交互式提问
  CI: 'true'

jobs:
  test:
    name: 先行检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @steward/core build
      - run: pnpm typecheck
      - run: pnpm test

  macos:
    name: macOS 通用包 (arm64 + x64)
    needs: test
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.targets == 'all' || inputs.targets == 'desktop' }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust（两个架构）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/app/src-tauri -> target

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @steward/core build

      - name: 打包 .dmg
        env:
          # 没有开发者证书时用 ad-hoc 签名，避免 Apple Silicon 下载后被判定为「已损坏」
          APPLE_SIGNING_IDENTITY: '-'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: node scripts/desktop-build.mjs --target universal-apple-darwin

      - uses: actions/upload-artifact@v4
        with:
          name: steward-macos-universal
          if-no-files-found: error
          retention-days: 7
          path: apps/app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

      # 自动更新用的增量包 + 签名，没配签名私钥时不存在
      - uses: actions/upload-artifact@v4
        with:
          name: steward-macos-updater
          if-no-files-found: ignore
          retention-days: 7
          path: |
            apps/app/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            apps/app/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

  windows:
    name: Windows 安装包 (nsis + msi)
    needs: test
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.targets == 'all' || inputs.targets == 'desktop' }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/app/src-tauri -> target

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @steward/core build

      - name: 打包 .exe / .msi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: node scripts/desktop-build.mjs --bundles nsis,msi

      - uses: actions/upload-artifact@v4
        with:
          name: steward-windows-x64
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/app/src-tauri/target/release/bundle/nsis/*.exe
            apps/app/src-tauri/target/release/bundle/msi/*.msi

      - uses: actions/upload-artifact@v4
        with:
          name: steward-windows-updater
          if-no-files-found: ignore
          retention-days: 7
          path: |
            apps/app/src-tauri/target/release/bundle/nsis/*.nsis.zip
            apps/app/src-tauri/target/release/bundle/nsis/*.nsis.zip.sig

  linux:
    name: Linux (AppImage + deb)
    needs: test
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.targets == 'all' || inputs.targets == 'desktop' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/app/src-tauri -> target

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @steward/core build

      - name: 打包 AppImage / deb
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: node scripts/desktop-build.mjs --bundles appimage,deb

      - uses: actions/upload-artifact@v4
        with:
          name: steward-linux-x64
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/app/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/app/src-tauri/target/release/bundle/deb/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: steward-linux-updater
          if-no-files-found: ignore
          retention-days: 7
          path: |
            apps/app/src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
            apps/app/src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz.sig

  android:
    name: Android APK (arm64 + armv7)
    needs: test
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.targets == 'all' || inputs.targets == 'mobile' || inputs.targets == 'android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # runner 自带 Android SDK 与 cmdline-tools，不再用 android-actions/setup-android：
      # 那个 action 会去装早已下架的 `tools` 包，导致 sdkmanager 直接失败。
      - name: 定位 Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      # 模板的 compileSdk 是 37，必须装对应 platform，否则 Gradle 会找不到 android-37
      - name: 安装 NDK 与构建工具
        run: |
          set -x
          echo "sdkmanager: $(command -v sdkmanager)"
          echo "sdk root:   $ANDROID_HOME"
          # runner 镜像里的 sdkmanager 可能带着旧缓存，看不到新发布的 platform
          rm -rf "$HOME/.android/cache"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          # 注意：Android 从 API 37 起改成「小版本」发布，包名是 platforms;android-37.0，
          # 不再是 platforms;android-37（后者会让 sdkmanager 报 Failed to find package）
          if ! sdkmanager --sdk_root="$ANDROID_HOME" --install \
              "ndk;27.0.12077973" "platforms;android-37.0" "platforms;android-36" \
              "build-tools;35.0.0" "platform-tools"; then
            echo "== 安装失败，当前仓库可见的 platform："
            sdkmanager --sdk_root="$ANDROID_HOME" --list | grep -E "platforms;android-3[0-9]" | tail -20 || true
            exit 1
          fi
          # AGP 的 compileSdk = 37 会去找 platforms/android-37，但 sdkmanager 装出来是
          # platforms/android-37.0，补一个软链让两边对齐
          ls "$ANDROID_HOME/platforms" || true
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust（Android 目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/app/src-tauri -> target

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @steward/core build

      # gen/android 不入库，每次 CI 现场生成，避免 Gradle 工程与 Tauri 版本漂移
      - name: 初始化 Android 工程
        working-directory: apps/app
        run: pnpm tauri android init --ci

      - name: 打包 debug APK
        working-directory: apps/app
        run: pnpm tauri android build --apk --debug --ci --target aarch64 armv7

      - uses: actions/upload-artifact@v4
        with:
          name: steward-android
          if-no-files-found: error
          retention-days: 7
          path: apps/app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  ios:
    name: iOS 模拟器包
    needs: test
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.targets == 'all' || inputs.targets == 'mobile' || inputs.targets == 'ios' }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust（iOS 目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/app/src-tauri -> target

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @steward/core build

      - name: 初始化 iOS 工程
        working-directory: apps/app
        run: pnpm tauri ios init --ci

      # 模拟器构建不需要证书；真机 / TestFlight 需要 Apple 签名，见 docs/05-ci.md
      - name: 构建模拟器 .app
        working-directory: apps/app
        run: pnpm tauri ios build --debug --target aarch64-sim --ci

      - name: 收集并压缩 .app
        run: |
          APP_PATH=$(find apps/app/src-tauri/gen/apple -maxdepth 6 -name '*.app' -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "未找到 .app，输出目录如下："
            find apps/app/src-tauri/gen/apple -maxdepth 6 -type d | head -n 60
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" steward-ios-simulator.zip

      - uses: actions/upload-artifact@v4
        with:
          name: steward-ios-simulator
          if-no-files-found: error
          retention-days: 7
          path: steward-ios-simulator.zip

  # 真机可安装的 IPA 需要 Apple 开发者账号（$99/年）与证书，无法默认开启。
  # 配置仓库变量 ENABLE_IOS_SIGNING=true + 三个 Secret 后，这个 job 才会运行。
  # 详见 docs/05-ci.md 的「iOS 安装包」一节。
  ios-ipa:
    name: iOS 签名 IPA（开发签名，需证书）
    needs: test
    if: ${{ vars.ENABLE_IOS_SIGNING == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust（iOS 真机目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/app/src-tauri -> target

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @steward/core build

      - name: 安装 Provisioning Profile
        env:
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_MOBILE_PROVISION" | base64 -d > "$HOME/Library/MobileDevice/Provisioning Profiles/steward.mobileprovision"

      - name: 初始化 iOS 工程
        working-directory: apps/app
        run: pnpm tauri ios init --ci

      # debugging = 开发签名：只能装在开发者账号里登记过 UDID 的设备上。
      # 要给测试人员用请改用 --export-method release-testing（TestFlight）。
      - name: 构建 IPA
        working-directory: apps/app
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
        run: pnpm tauri ios build --export-method debugging --ci

      - name: 收集 IPA
        run: |
          IPA=$(find apps/app/src-tauri/gen/apple -maxdepth 6 -name '*.ipa' | head -n 1)
          if [ -z "$IPA" ]; then
            echo "未找到 .ipa，输出目录："
            find apps/app/src-tauri/gen/apple -maxdepth 4 -type d | head -n 40
            exit 1
          fi
          cp "$IPA" steward-ios.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: steward-ios-ipa
          if-no-files-found: error
          retention-days: 7
          path: steward-ios.ipa

  # 给「临时签名 / 免费 Apple ID」用户用：产出未签名真机 IPA，
  # 下载后用 Sideloadly / AltStore 用自己的 Apple ID 重签并安装。
  # 不走 Tauri 的 archive+export（那一步强依赖签名），直接 xcodebuild 关掉签名。
  ios-unsigned:
    name: iOS 未签名 IPA（自签用）
    needs: test
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.targets == 'all' || inputs.targets == 'mobile' || inputs.targets == 'ios' }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust（iOS 真机目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/app/src-tauri -> target

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @steward/core build

      - name: 初始化 iOS 工程
        working-directory: apps/app
        run: pnpm tauri ios init --ci

      - name: 构建未签名 .app
        working-directory: apps/app/src-tauri/gen/apple
        run: |
          set -euo pipefail
          PROJECT=$(ls -d *.xcodeproj | head -n 1)
          echo "project: $PROJECT"
          ls -la
          # 工程名是 crate 名（steward），scheme 名可能不同，必须查一下
          xcodebuild -list -project "$PROJECT"
          SCHEME=$(xcodebuild -list -json -project "$PROJECT" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['project']['schemes'][0])")
          echo "scheme: $SCHEME"
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/ios-dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 打包成 .ipa
        run: |
          set -euo pipefail
          APP=$(find "$RUNNER_TEMP/ios-dd/Build/Products" -maxdepth 3 -name "*.app" -type d | head -n 1)
          if [ -z "$APP" ]; then
            echo "没找到 .app，构建产物目录如下："
            find "$RUNNER_TEMP/ios-dd/Build/Products" -maxdepth 3 | head -n 40
            exit 1
          fi
          echo "app=$APP"
          rm -rf Payload steward-ios-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry steward-ios-unsigned.ipa Payload
          ls -lh steward-ios-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: steward-ios-unsigned
          if-no-files-found: error
          retention-days: 7
          path: steward-ios-unsigned.ipa

  release:
    name: 汇总到 Release
    needs: [macos, windows, linux, android, ios, ios-unsigned, ios-ipa]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 列出产物
        run: ls -R artifacts

      # 只有存在签名产物时才生成 latest.json；否则更新检查会指向不存在的清单
      - name: 生成 latest.json
        if: ${{ hashFiles('artifacts/**/*.sig') != '' }}
        run: |
          node scripts/make-latest-json.mjs \
            --dir artifacts \
            --repo "${{ github.repository }}" \
            --tag "${GITHUB_REF_NAME}" \
            --out artifacts/latest.json

      - uses: softprops/action-gh-release@v2
        with:
          # 默认草稿：先自己验证再点发布。仓库变量 PUBLISH_DRAFT=false 可改为直接发布
          draft: ${{ vars.PUBLISH_DRAFT != 'false' }}
          generate_release_notes: true
          files: artifacts/**/*
