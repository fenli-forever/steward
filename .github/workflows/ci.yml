name: ci

# 快速质量门禁：类型检查、单测、前端构建、Rust 编译检查。
# 完整的多端打包在 build.yml 中，只跑 tag 或手动触发，避免每次 push 都烧 40 分钟 CI。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: 类型检查 / 单测 / 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # @steward/sync 的测试会 import @steward/core 的构建产物，所以必须先 build
      - name: 构建领域层
        run: pnpm --filter @steward/core build

      - name: 类型检查
        run: pnpm typecheck

      - name: 单元测试
        run: pnpm test

      - name: 前端构建
        run: pnpm build

  rust:
    name: Rust 编译检查
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/app/src-tauri -> target

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # tauri::generate_context! 在编译期读取 frontendDist，缺了 dist 会直接编译失败
      - name: 构建前端产物
        run: |
          pnpm --filter @steward/core build
          pnpm --filter @steward/app build

      - name: 格式检查
        run: cargo fmt --manifest-path apps/app/src-tauri/Cargo.toml --check

      - name: cargo check
        run: cargo check --manifest-path apps/app/src-tauri/Cargo.toml
