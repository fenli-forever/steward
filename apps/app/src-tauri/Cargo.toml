[package]
name = "steward"
version = "0.1.1"
description = "Steward — 个人数字资产管家"
authors = ["Steward"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "steward_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 系统钥匙串：macOS Keychain / Windows Credential Manager / Linux Secret Service
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
zeroize = "1"

# 云厂商 API 调用（签名在 Rust 侧完成，AccessKey 不进 JS）
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form"] }
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
quick-xml = "0.38"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
